name: Render Video

# Triggered by the Cloudflare Worker via workflow_dispatch.
# GitHub Actions free tier: 2,000 min/month private repos, UNLIMITED
# on public repos. Each render takes roughly 3-8 minutes depending on
# video length, so free tier comfortably covers dozens-hundreds/month.
#
# STORAGE: finished videos are published as a GitHub Release asset using
# this workflow run's own built-in token — no separate storage service,
# no payment card, needed anywhere in this stack.

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      script:
        required: false
      topic:
        required: false
      avatar_url:
        required: false

permissions:
  contents: write   # required so this workflow can publish a Release

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts requests pillow --break-system-packages

      - name: Write script to file
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SCRIPT_CONTENT: ${{ inputs.script }}
          TOPIC_CONTENT: ${{ inputs.topic }}
        run: |
          if [ -n "$SCRIPT_CONTENT" ]; then
            printf '%s\n' "$SCRIPT_CONTENT" > script.txt
          else
            python3 expand_topic.py "$TOPIC_CONTENT" > script.txt
          fi

      - name: Download avatar (if provided)
        if: ${{ inputs.avatar_url != '' }}
        run: |
          curl -sL "${{ inputs.avatar_url }}" -o avatar_input.jpg
          echo "AVATAR_PATH=avatar_input.jpg" >> $GITHUB_ENV

      - name: Set topic anchor (keeps stock footage on-theme)
        if: ${{ inputs.topic != '' }}
        env:
          TOPIC_VALUE: ${{ inputs.topic }}
        run: echo "TOPIC_ANCHOR=$TOPIC_VALUE" >> $GITHUB_ENV

      - name: Run render pipeline
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          ARGS=(script.txt final_video.mp4)
          if [ -n "$AVATAR_PATH" ]; then ARGS+=(--avatar "$AVATAR_PATH"); fi
          if [ -n "$TOPIC_ANCHOR" ]; then ARGS+=(--topic-anchor "$TOPIC_ANCHOR"); fi
          python3 pipeline.py "${ARGS[@]}"

      - name: Publish video as a GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          mv final_video.mp4 "video-${JOB_ID}.mp4"
          gh release create "video-${JOB_ID}" "video-${JOB_ID}.mp4" \
            --title "Video ${JOB_ID}" \
            --notes "Auto-generated by the text-to-video pipeline."
          echo "video_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/video-${JOB_ID}/video-${JOB_ID}.mp4" >> "$GITHUB_OUTPUT"

      - name: Notify worker of completion
        if: success()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_URL: ${{ steps.publish.outputs.video_url }}
        run: |
          curl -X POST "${WORKER_URL}/api/render-complete" \
            -H "X-Render-Secret: ${RENDER_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"jobId\": \"${JOB_ID}\", \"videoUrl\": \"${VIDEO_URL}\"}"

      - name: Notify worker of failure
        if: failure()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl -X POST "${WORKER_URL}/api/render-complete" \
            -H "X-Render-Secret: ${RENDER_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"jobId\": \"${JOB_ID}\", \"error\": \"Render failed — check GitHub Actions logs for job ${JOB_ID}.\"}"
